backend:
  name: github
  repo: ondrej-kapal/moonlight-web-test
  branch: main
  # The OAuth relay runs as Vercel functions in this repo (api/auth.js, api/callback.js).
  # base_url = origin of the deployed site — must match the GitHub OAuth App settings.
  base_url: https://moonlight-web-test.vercel.app
  auth_endpoint: api/auth

# Drafts are stored as GitHub PRs — published only via the "Publish" button.
publish_mode: editorial_workflow

local_backend: true

# Media library — set "file" explicitly if the schema ever requires it.
# media_library:
#   name: file

# Allows storing images next to index.md (relative to the entry file).
media_folder_relative: true

# Fallback (when a collection has no per-collection override).
media_folder: "public/content/uploads"
public_folder: "/content/uploads"

collections:
  - label: "Články"
    name: "articles"
    folder: "public/content/articles"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Perex", name: "excerpt", widget: "text", required: false }
      - { label: "Obrázek", name: "cover", widget: "image", required: false }
      - { label: "Obsah", name: "body", widget: "markdown" }
      - { label: "Tagy", name: "tags", widget: "list", required: false }

  - label: "Portfolio"
    name: "portfolio_items"
    folder: "public/content/portfolio"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Název", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Popis", name: "description", widget: "markdown", required: false }
      - label: "Galerie"
        name: "images"
        widget: "list"
        summary: "{{fields.image}}"
        field: { label: "Obrázek", name: "image", widget: "image" }
      - { label: "Tagy", name: "tags", widget: "list", required: false }

  - label: "Volné návrhy"
    name: "designs"
    folder: "public/content/designs"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Název", name: "title", widget: "string" }
      - { label: "Velikost", name: "size", widget: "string", required: false }
      - { label: "Umístění", name: "placement", widget: "string", required: false }
      - label: "Obrázky"
        name: "images"
        widget: "list"
        field: { label: "Obrázek", name: "image", widget: "image" }
