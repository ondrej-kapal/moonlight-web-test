backend:
  name: github
  repo: ondrej-kapal/moonlight-web-test
  branch: main
  # OAuth relay běží jako Vercel functions v tomto repu (api/auth.js, api/callback.js).
  # base_url = doména nasazeného webu — po vytvoření Vercel projektu doplň skutečnou doménu!
  base_url: https://moonlight-web-test.vercel.app # TODO: replace with the real Vercel domain
  auth_endpoint: api/auth

# Návrhy se ukládají jako koncepty (PR na GitHubu) — publikuje se až tlačítkem "Publish".
publish_mode: editorial_workflow

local_backend: true

# Media knihovna – explicitně uvedeme "file", ať projde schématem.
# media_library:
#   name: file

# Umožní ukládat obrázky vedle index.md (relativně k entry souboru).
media_folder_relative: true

# Fallback (když někde nezadáme per-collection override).
media_folder: "public/content/uploads"
public_folder: "/content/uploads"

collections:
  - label: "Články"
    name: "articles"
    folder: "public/content/articles"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Titulek", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Perex", name: "excerpt", widget: "text", required: false }
      - { label: "Obrázek", name: "cover", widget: "image", required: false }
      - { label: "Obsah", name: "body", widget: "markdown" }
      - { label: "Tagy", name: "tags", widget: "list", required: false }

  - label: "Portfolio"
    name: "portfolio_items"
    folder: "public/content/portfolio"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Název", name: "title", widget: "string" }
      - { label: "Datum", name: "date", widget: "datetime" }
      - { label: "Popis", name: "description", widget: "markdown", required: false }
      - label: "Galerie"
        name: "images"
        widget: "list"
        summary: "{{fields.image}}"
        field: { label: "Obrázek", name: "image", widget: "image" }
      - { label: "Tagy", name: "tags", widget: "list", required: false }

  - label: "Volné návrhy"
    name: "designs"
    folder: "public/content/designs"
    create: true
    path: "{{slug}}/index"
    extension: "md"
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Název", name: "title", widget: "string" }
      - { label: "Velikost", name: "size", widget: "string", required: false }
      - { label: "Umístění", name: "placement", widget: "string", required: false }
      - label: "Obrázky"
        name: "images"
        widget: "list"
        field: { label: "Obrázek", name: "image", widget: "image" }
