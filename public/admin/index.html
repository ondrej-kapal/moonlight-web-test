<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moonlight Tattoo Wizard</title>

    <!-- Load the config by absolute URL: Decap resolves a relative config.yml
         against the page URL, which breaks when the page is served at /admin
         (no trailing slash) — it would fetch /config.yml and get the SPA's
         index.html instead. -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
  </head>
  <body>
    <!-- Decap CMS UI from CDN; no inline CMS.init — the config comes solely
         from the link tag above (avoids duplicate collection definitions). -->
    <script src="https://unpkg.com/decap-cms@3.14.1/dist/decap-cms.js"></script>
  </body>
</html>
